services:
  # Genera una clave de autenticación interna en un volumen local, nunca en Git.
  mongo-keyfile-init:
    image: mongo:8.0
    user: "0:0"
    restart: "no"
    volumes:
      - mongodb_config:/data/configdb
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /data/configdb/keyfile ]; then
          openssl rand -base64 512 > /data/configdb/keyfile
        fi
        chown 999:999 /data/configdb/keyfile
        chmod 400 /data/configdb/keyfile

  mongodb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-system-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/keyfile"]
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-library_system}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.hello().isWritablePrimary || quit(1)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Inicializa rs0 una sola vez; es seguro ejecutarlo en cada `docker compose up`.
  # Se mantiene como servicio separado para inicializar también volúmenes existentes.
  mongo-replica-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_started
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mongosh --quiet --host mongodb --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do
          sleep 1
        done
        mongosh --quiet --host mongodb --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval '
          try {
            rs.status();
          } catch (error) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
          }
        '

volumes:
  mongodb_data:
  mongodb_config:
